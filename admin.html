<!DOCTYPE html>
<html>
<head>
    <title>DAS Admin — Lead Management</title>
    <style>
        body { font-family: sans-serif; background: #0a0c0f; color: white; padding: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #1a2230; padding: 12px; text-align: left; }
        th { background: #141a21; color: #00e5a0; }
        .login-box { max-width: 300px; margin: 100px auto; background: #0f1318; padding: 20px; border-radius: 8px; border: 1px solid #1a2230; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #1a2230; border: 1px solid #3a4455; color: white; }
        button { background: #00e5a0; color: black; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-section" class="login-box">
        <h3>DAS Admin Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Login to Dashboard</button>
    </div>

    <div id="admin-panel" style="display:none;">
        <h1>DAS Lead Management</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Company</th>
                    <th>Email</th>
                    <th>Service</th>
                    <th>Challenge</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
        <br>
        <button onclick="location.reload()" style="width: auto; padding: 10px 20px;">Refresh Leads</button>
        <button onclick="exportToCSV()" style="background: #0084ff; color: white; width: auto; padding: 10px 20px;">Export CSV
</button>
    </div>

    <script>
    // 1. LOGIN FUNCTION
    async function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // FIX: Removed 127.0.0.1 and added credentials
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass }),
            credentials: 'include' 
        });

        if (response.ok) {
            document.getElementById('login-section').style.display = 'none';
            loadLeads(); 
        } else {
            alert("Invalid Credentials, Elias!");
        }
    }

    // 2. LOAD DATA FUNCTION
    async function loadLeads() {
        // FIX: Removed 127.0.0.1 and added credentials
        const response = await fetch('/api/admin/leads', {
            credentials: 'include'
        });

        if (response.ok) {
            const leads = await response.json();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ''; 
            document.getElementById('admin-panel').style.display = 'block';

            leads.forEach(lead => {
                tbody.innerHTML += `
                    <tr>
                        <td>${lead.name}</td>
                        <td>${lead.company}</td>
                        <td>${lead.email}</td>
                        <td>${lead.service}</td>
                        <td>${lead.challenge}</td>
                        <td>
                            <button onclick="deleteLead(${lead.id})" style="background:#ff5c35; color:white; padding:5px 10px; border-radius:4px; font-size:11px;">
                                Delete
                            </button>
                        </td>
                    </tr>`;
            });
        }
    }

    // 3. EXPORT FUNCTION (Keep as is, it's local only)
    function exportToCSV() {
        const table = document.getElementById('table-body');
        const rows = Array.from(table.querySelectorAll('tr'));
        let csvContent = "Name,Company,Email,Service,Challenge\n";

        rows.forEach(row => {
            const cols = Array.from(row.querySelectorAll('td')).map(td => `"${td.innerText}"`);
            csvContent += cols.join(",") + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'das_leads_export.csv');
        a.click();
    } 

    // 4. DELETE FUNCTION
    async function deleteLead(id) {
        if (confirm("Elias, are you sure you want to delete this lead?")) {
            // FIX: Removed 127.0.0.1 and added credentials
            const response = await fetch(`/api/admin/leads/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            if (response.ok) {
                loadLeads(); 
            } else {
                alert("Delete failed!");
            }
        }
    }
</script>
